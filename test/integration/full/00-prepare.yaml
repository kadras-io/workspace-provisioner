---
# The credentials shared with the workspaces, stored in a central namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: kadras-system
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: kadras-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
---
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  namespace: kadras-system
stringData:
  username: user
  password: pass
