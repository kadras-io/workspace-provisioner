---
# The credentials shared with the workspaces, stored in a central namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: kadras-system
---
apiVersion: v1
kind: Secret
metadata:
  name: supply-chain-registry-credentials
  namespace: kadras-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
---
apiVersion: v1
kind: Secret
metadata:
  name: supply-chain-cosign-key-pair
  namespace: kadras-system
stringData:
  cosign.key: key
  cosign.password: pass
  cosign.pub: pub
---
apiVersion: v1
kind: Secret
metadata:
  name: supply-chain-git-credentials
  namespace: kadras-system
stringData:
  username: user
  password: pass
