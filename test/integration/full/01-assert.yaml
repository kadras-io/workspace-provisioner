---
# The credentials are exported to the workspace...
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretExport
metadata:
  name: registry-credentials
  namespace: kadras-system
spec:
  toNamespaces:
    - test-full
---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretExport
metadata:
  name: git-credentials
  namespace: kadras-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-full
  labels:
    app.kubernetes.io/component: workspace-provisioner
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: test-full
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
---
# ...where secretgen-controller imports them into Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  namespace: test-full
data:
  username: dXNlcg==
  password: cGFzcw==
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: test-full
imagePullSecrets:
  - name: canonical-registry-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-reconciler
  namespace: test-full
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-reconciler
  namespace: test-full
roleRef:
  kind: ClusterRole
  name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-edit
  namespace: test-full
roleRef:
  kind: ClusterRole
  name: edit
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  # The GitOps ServiceAccount manages the workloads in the workspace, but nothing outside.
  - script: test "$(kubectl auth can-i create deployments -n test-full --as=system:serviceaccount:test-full:gitops-reconciler)" = yes
  - script: test "$(kubectl auth can-i create rolebindings -n test-full --as=system:serviceaccount:test-full:gitops-reconciler)" = yes
  - script: test "$(kubectl auth can-i create deployments -n default --as=system:serviceaccount:test-full:gitops-reconciler)" = no
  # The members of the group edit the workloads in the workspace, but not its access.
  - script: test "$(kubectl auth can-i create deployments -n test-full --as=jane --as-group=team-a)" = yes
  - script: test "$(kubectl auth can-i create rolebindings -n test-full --as=jane --as-group=team-a)" = no
  # The restricted Pod Security Standard rejects privileged Pods.
  - script: |
      ! kubectl run privileged -n test-full --image=busybox --dry-run=server \
        --overrides='{"spec":{"containers":[{"name":"privileged","image":"busybox","securityContext":{"privileged":true}}]}}' 2>&1 \
        | tee /dev/stderr | grep -q 'created (server dry run)'
