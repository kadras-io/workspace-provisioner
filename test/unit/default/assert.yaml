---
# Without credentials, each workspace gets a namespace enforcing the restricted Pod Security Standard,
# an empty placeholder for the OCI registry credentials, and the GitOps ServiceAccount.
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    app.kubernetes.io/component: workspace-provisioner
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    kapp.k14s.io/create-strategy: fallback-on-update
    kapp.k14s.io/delete-strategy: orphan
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: dev
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
    kapp.k14s.io/create-strategy: fallback-on-update
type: kubernetes.io/dockerconfigjson
---
# The workloads pull their images with the `default` ServiceAccount, which is adopted and never deleted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: dev
  labels:
    app.kubernetes.io/component: workspace-provisioner
  annotations:
    kapp.k14s.io/create-strategy: fallback-on-update
    kapp.k14s.io/delete-strategy: orphan
imagePullSecrets:
  - name: canonical-registry-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-reconciler
  namespace: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-reconciler
  namespace: dev
roleRef:
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: gitops-reconciler
