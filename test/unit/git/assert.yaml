---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretExport
metadata:
  name: git-credentials
  namespace: kadras-system
spec:
  toNamespaces:
    - dev
---
# The Git credentials are imported as they are, for the Flux sources in the workspace.
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretImport
metadata:
  name: git-credentials
  namespace: dev
spec:
  fromNamespace: kadras-system
