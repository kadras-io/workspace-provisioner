---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretExport
metadata:
  name: cosign-key-pair
  namespace: kadras-system
spec:
  toNamespaces:
    - dev
---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretImport
metadata:
  name: cosign-key-pair
  namespace: dev
  labels:
    app.kubernetes.io/component: workspace-provisioner
  annotations:
    kapp.k14s.io/create-strategy: fallback-on-update
spec:
  fromNamespace: kadras-system
---
# The imported key pair is attached to the ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: supply-chain
  namespace: dev
secrets:
  - name: cosign-key-pair
