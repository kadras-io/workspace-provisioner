#@ load("@ytt:data", "data")
#@ load("/lib/workspace.star", "labels", "shared_secrets", "workspace_names")

#! The secretgen-controller SecretExports share the credentials with the workspaces, where they're imported
#! by a SecretImport (Git) or by a placeholder Secret (OCI registry).
#! See: https://github.com/carvel-dev/secretgen-controller/blob/develop/docs/secret-export.md

#@ if workspace_names():
#@ for secret in shared_secrets():
---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretExport
metadata:
  name: #@ secret.name
  namespace: #@ secret.namespace
  labels: #@ labels()
spec:
  toNamespaces: #@ workspace_names()
#@ end
#@ end
