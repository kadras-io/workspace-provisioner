#@ load("/lib/validation.star", "is_dns_label", "is_dns_subdomain", "is_http_url", "is_secret_ref_complete")

#@ def namespaces_unique(namespaces):
#@   names = [namespace["name"] for namespace in namespaces]
#@   return len(names) == len({name: None for name in names})
#@ end

#@data/values-schema
---

#@schema/desc "The namespaces to provision and configure as workspaces."
#@schema/validation ("unique namespace names", namespaces_unique)
namespaces:
  #@schema/desc "A namespace to provision and configure as a workspace."
  -
    #@schema/desc "The name of the namespace. It's created if it doesn't exist."
    #@schema/validation ("a valid DNS label", is_dns_label), min_len=1, max_len=63
    name: ""

#@schema/desc "The ServiceAccount to configure with credentials and roles in each workspace."
#@schema/validation ("a valid DNS subdomain", is_dns_subdomain), min_len=1, max_len=253
service_account: supply-chain

#! =============================================
#! Credentials
#! =============================================

#@schema/desc "Settings for accessing the OCI registry from the workspaces."
oci:
  #@schema/desc "The Secret holding the credentials to pull images from the OCI registry, shared with the workspaces."
  #@schema/validation ("both `name` and `namespace` to be set, or neither", is_secret_ref_complete)
  pull_secret:
    #@schema/desc "The name of the Secret holding the credentials to pull images from the OCI registry. See docs/credentials.md for the expected format."
    name: ""
    #@schema/desc "The namespace of the Secret holding the credentials to pull images from the OCI registry."
    namespace: ""

#@schema/desc "Settings for Cosign, used to sign and verify OCI artifacts from the workspaces."
cosign:
  #@schema/desc "The Secret holding the Cosign key pair, shared with the workspaces."
  #@schema/validation ("both `name` and `namespace` to be set, or neither", is_secret_ref_complete)
  secret:
    #@schema/desc "The name of the Secret holding the Cosign key pair. See docs/credentials.md for the expected format."
    name: ""
    #@schema/desc "The namespace of the Secret holding the Cosign key pair."
    namespace: ""

#@schema/desc "Settings for accessing the Git repositories used in the GitOps workflows from the workspaces."
git:
  #@schema/desc "The Git server hosting the Git repositories used in the GitOps workflows."
  #@schema/validation ("an HTTP or HTTPS URL, like `https://github.com`", is_http_url)
  server: https://github.com
  #@schema/desc "The Secret holding the Git credentials, shared with the workspaces."
  #@schema/validation ("both `name` and `namespace` to be set, or neither", is_secret_ref_complete)
  secret:
    #@schema/desc "The name of the Secret holding the Git credentials. See docs/credentials.md for the expected format."
    name: ""
    #@schema/desc "The namespace of the Secret holding the Git credentials."
    namespace: ""
