#@ load("@ytt:data", "data")
#@ load("@ytt:template", "template")
#@ load("/lib/workspace.star", "adopt_annotations", "image_pull_secret_name", "is_git_secret_set", "keep_annotations", "labels")

#! The credentials of each workspace, imported from the Secrets shared by the SecretExports.
#! See: https://github.com/carvel-dev/secretgen-controller/blob/develop/docs/secret-export.md

#@ for namespace in data.values.namespaces:

#! The placeholder Secret is populated by secretgen-controller with the OCI registry credentials exported to the namespace,
#! or left empty when there are none.
---
apiVersion: v1
kind: Secret
metadata:
  name: #@ image_pull_secret_name
  namespace: #@ namespace.name
  labels: #@ labels()
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
    _: #@ template.replace(adopt_annotations())
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K

#! The workloads run with the `default` ServiceAccount unless they set another one, like Knative Services,
#! so it pulls the images with the OCI registry credentials. It's created by Kubernetes in each namespace:
#! it's adopted, and never deleted.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: #@ namespace.name
  labels: #@ labels()
  annotations: #@ keep_annotations()
imagePullSecrets:
  - name: #@ image_pull_secret_name

#! The Git credentials, for example for the Flux sources in the workspace (`spec.secretRef`).
#@ if/end is_git_secret_set():
---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretImport
metadata:
  name: #@ data.values.git.secret.name
  namespace: #@ namespace.name
  labels: #@ labels()
  annotations: #@ adopt_annotations()
spec:
  fromNamespace: #@ data.values.git.secret.namespace

#@ end
