#@ load("@ytt:data", "data")
#@ load("/lib/workspace.star", "adopt_annotations", "labels", "members_by_role")

#! The access to each workspace, granted via the Kubernetes default roles, bound in the namespace. The platform packages
#! extend them with the permissions on their resources via aggregation, like Knative Serving and Flux.
#! See: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#user-facing-roles

#@ for namespace in data.values.namespaces:

#! The GitOps tools deploy the workloads in the workspace with this ServiceAccount, like Flux Kustomizations
#! via `spec.serviceAccountName`. It can manage the workloads and the access to the workspace, but nothing outside.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-reconciler
  namespace: #@ namespace.name
  labels: #@ labels()
  annotations: #@ adopt_annotations()

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-reconciler
  namespace: #@ namespace.name
  labels: #@ labels()
  annotations: #@ adopt_annotations()
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: gitops-reconciler

#! The members of the workspace, with a RoleBinding for each role.
#@ for role, members in members_by_role(namespace).items():
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: #@ "workspace-" + role
  namespace: #@ namespace.name
  labels: #@ labels()
  annotations: #@ adopt_annotations()
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: #@ role
subjects:
#@ for member in members:
  - apiGroup: rbac.authorization.k8s.io
    kind: #@ member.kind
    name: #@ member.name
#@ end
#@ end

#@ end
